# Do not commit a real API key or database password to Git.
apiVersion: v1
kind: Secret
metadata:
  name: sre-agent-secrets
  namespace: sre-agents
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  OPENAI_MODEL: "replace-with-a-model-you-have-access-to"
  # For the MVP you can point this at the existing PostgreSQL instance.
  # Prefer a separate database/schema or separate user for the agent.
  DATABASE_URL: "postgresql://USER:PASSWORD@POSTGRES_SERVICE:5432/DATABASE"
