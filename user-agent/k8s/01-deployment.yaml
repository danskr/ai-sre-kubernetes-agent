apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-agent
  namespace: user-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-agent
  template:
    metadata:
      labels:
        app: user-agent
    spec:
      automountServiceAccountToken: false
      containers:
        - name: user-agent
          image: user-agent:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_URL
              value: "http://bulletin-board.bulletin-board.svc.cluster.local/api/v1/messages?limit=1"
            - name: MIN_INTERVAL_SECONDS
              value: "3"
            - name: MAX_INTERVAL_SECONDS
              value: "5"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "2"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
